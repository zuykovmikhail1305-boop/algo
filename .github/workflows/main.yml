name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-project   # все команды выполняются внутри проекта

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: my-project/.python-version   # берёт 3.13 из твоего файла

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --locked          # ставит numpy, pytest и т.д. строго по uv.lock

      - name: Run tests
        run: uv run pytest -v